<!DOCTYPE html>
<html>

<head>
  <title>React Basics</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
    }

    .send-button {
      background-color: rgb(25, 135, 84);
      padding: 12px 20px;
      color: white;
      margin-left: 10px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input {
      padding: 12px 15px;
      border-radius: 10px;
      border-width: 1px;
      font-size: 15px;

      flex-grow: 1;
    }

    .chat-input-container {
      display: flex;
      margin-bottom: 60px;
    }

    .app-container {
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;

      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-message-user {
      display: flex;
      justify-content: end;
      /* by default the algin item is stretch so that is why it will stretch the image or an element */
      align-items: start;
    }

    .chat-message-robot {
      display: flex;
      align-items: start;
    }

    .chat-message-text {
      background-color: rgb(238, 238, 238);
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }

    .chat-message-profile {
      width: 45px;
    }

    .chat-messages-container {
      flex-grow: 1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width: none;
    }
  </style>
</head>

<body>
  <div class="js-container"></div>

  <!-- This is for the part of getting the DATE and Time function. -->
  <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/Chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">

    let ChatInput = ({ chatMessages, setChatMessages }) => {

      const [inputText, setInputText] = React.useState('');


      function saveInputText(event) {
        setInputText(event.target.value);
      }

      const sendMessage = async () => {
        const newChatMessages = [
          ...chatMessages,
          {
            message: inputText,
            sender: 'user',
            id: crypto.randomUUID()
          }
        ]
        setChatMessages(newChatMessages);
        setInputText('');

        const typingId = crypto.randomUUID();
        setChatMessages((prev) => [
          ...prev,
          { message: 'Loading...', sender: 'robot', id: typingId },
        ]);

        const response = await Chatbot.getResponseAsync(inputText);

        // setChatMessages([
        //   ...newChatMessages,
        //   {
        //     message: response,
        //     sender: 'robot',
        //     id: crypto.randomUUID()
        //   }
        // ])

        setChatMessages((prev) =>
          prev.map((msg) =>
            msg.id === typingId ? { ...msg, message: response } : msg
          )
        );

        // setInputText('');
      };

      function keyPressed(e) {
        if (e.key === "Enter") {
          sendMessage();
        } else if (e.key === "Escape") {
          setInputText('');
        }
      };

      return (
        <div className="chat-input-container">
          <input
            type="text"
            name="newInput"
            placeholder="Send a message to Chatbot"
            size="30"
            onChange={saveInputText}
            value={inputText}
            className="chat-input"
            onKeyDown={keyPressed}
          />
          <button
            onClick={sendMessage}
            className="send-button"
          >Send</button>
        </div>
      );
    }

    let ChatMessage = ({ message, sender }) => {
      // const message = props.message;
      // const sender = props.sender;

      // distructuring --> it is a shortcut for the above. 👆👆


      // This also has a shortcut for it self and that is in the parameter section.

      // const { message, sender } = props;

      /*
      if(sender === 'robot'){
        return (
          <div>
            <img src="./robot.png" width="50" />
            {message}
          </div>
        );
      }
      */

      return (
        <div className={
          sender === 'robot'
            ? 'chat-message-robot'
            : 'chat-message-user'
        }>

          {sender === 'robot' && (
            <img src="./robot.png"
              className="chat-message-profile"
            />
          )}
          <div className="chat-message-text">
            {message}
          </div>
          {sender === 'user' && (
            <img src="./user.png"
              className="chat-message-profile"
            />

          )}
        </div>
      );
    }

    function ChatMessages({ chatMessages }) {
      const chatMessagesRef = React.useRef(null);

      React.useEffect(() => {
        const containerElem = chatMessagesRef.current;
        if(containerElem){
          containerElem.scrollTop = containerElem.scrollHeight;
        }
      }, [chatMessages]);

      return (
        <div className='chat-messages-container'
        ref={chatMessagesRef}>
          {
            chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })
          }
        </div>
      );
    }

    function App() {
      const [chatMessages, setChatMessages] = React.useState([
        // {
        //   message: 'Hello! ChatBot',
        //   sender: 'user',
        //   // keys are essintial for react to track the changes in our project. for that matter each list item must have a key.
        //   id: 'id1'
        // }, {
        //   message: 'Hello! How can I help you?',
        //   sender: 'robot',
        //   id: 'id2'
        // }, {
        //   message: 'What day is today?',
        //   sender: 'user',
        //   id: 'id3'
        // }, {
        //   message: 'Today is monday 2nd of April.',
        //   sender: 'robot',
        //   id: 'id4'
        // }
      ]);


      // It also has a short cut and that is 👆
      // const [chatMessages, setChatMessages] = array;
      // 👆The shortcut.
      // 👇These are both shortcuts for these below.
      // const chatMessages = array[0];
      // const setChatMessages = array[1];

      return (
        <div className="app-container">


          <ChatMessages
            chatMessages={chatMessages}
          />


          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
          />
        </div>
      );
    }

    const container = document.querySelector('.js-container');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>

</html>
